<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SIH Dashboard — High-Fidelity Mockup</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
      body{display:flex;align-items:center;justify-content:center;padding:40px;background:#e9f2ff}
      .mockup-frame{width:1400px;box-shadow:0 40px 80px rgba(2,6,23,0.12);border-radius:22px;background:linear-gradient(180deg,#f8fbff,#eef6ff);padding:26px}
      .mockup-inner{background:transparent;border-radius:16px;padding:0}
    </style>
  </head>
  <body>
    <div class="mockup-frame">
      <div class="mockup-inner">
        <!-- Reuse the main layout by embedding index.html content via iframe to preserve exact visuals -->
        <iframe src="index.html" style="width:100%;height:820px;border:0;border-radius:12px;overflow:hidden"></iframe>
      </div>
    </div>
  </body>
</html>
